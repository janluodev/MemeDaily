name: ci

on:
  push:
    branches: [main]
    # Trusted daily publication already checks this exact data-only tree. Pages still
    # independently runs the canonical gate and deploys every main commit.
    paths-ignore:
      - "data/daily/*.json"
      - "data/daily-news/*.json"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    # Exact daily candidates run the trusted pull_request_target checks instead of
    # building the same tree again here. Other pull requests retain normal CI.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'codex/daily-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # —— 协作 OS 层检查（与本地 .githooks 同源 scripts/checks/*）——
      - name: 状态新鲜度（.cloud.md）
        run: bash scripts/checks/check-state-fresh.sh --all

      - name: 文件行数（全仓）
        run: STRICT=1 bash scripts/checks/check-file-size.sh --all

      - name: 关键文件头说明
        run: STRICT=1 bash scripts/checks/check-key-file-header.sh --all

      - name: 依赖边界
        run: STRICT=1 bash scripts/checks/check-import-boundaries.sh --all

      - name: 密钥扫描（全仓 tracked）
        run: bash scripts/checks/check-secrets.sh --all

      # —— 应用架构层检查 ——
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: 安装应用层依赖
        run: npm ci

      - name: 生产依赖高危漏洞门禁
        run: npm run audit:prod

      - name: 应用层 lint / typecheck / test
        run: |
          npm run validate
          npm run validate:news --if-present
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present

      # 构建会重写 next-env.d.ts 等已跟踪生成文件；若 PR 未提交最新结果，
      # 受信发布管线会在 check 后的 git pull --rebase 处失败（exit 128）。
      - name: 生成文件一致性（构建后工作区须干净）
        run: git diff --exit-code
