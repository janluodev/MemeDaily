version: 2
updates:
  # Keep SHA-pinned actions current through small, reviewable weekly PRs; pinning
  # prevents silent tag moves but must not freeze upstream security fixes.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
